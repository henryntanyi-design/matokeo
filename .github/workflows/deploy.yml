name: Deploy to Namecheap

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Pata code
        uses: actions/checkout@v4

      # The locked packages support PHP 7.4-8.4 only, while ubuntu-latest ships a
      # newer PHP, so pin a supported version and the extensions the vendor needs.
      - name: Sanidi PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, zip, mbstring, xml, dom, iconv, simplexml, xmlreader, xmlwriter, fileinfo, ctype
          coverage: none

      - name: Jenga Composer vendor/
        run: composer install --no-interaction --no-progress --optimize-autoloader

      - name: Angalia FTP credentials
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USER || secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          missing=0
          if [ -z "$FTP_SERVER" ]; then
            echo "::error::Missing secret FTP_SERVER"
            missing=1
          fi
          if [ -z "$FTP_USER" ]; then
            echo "::error::Missing secret FTP_USER (or FTP_USERNAME)"
            missing=1
          fi
          if [ -z "$FTP_PASS" ]; then
            echo "::error::Missing secret FTP_PASS"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Set these in GitHub repo Settings -> Secrets and variables -> Actions -> Secrets:"
            echo "  FTP_SERVER"
            echo "  FTP_PASS"
            echo "  FTP_USER or FTP_USERNAME"
            echo "Optional: FTP_SERVER_DIR (variable or secret) - defaults to ./public_html/"
            exit 1
          fi
          echo "FTP credentials are present."

      - name: Paka faili kwa FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER || secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: ${{ vars.FTP_SERVER_DIR || secrets.FTP_SERVER_DIR || './public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            config.example.php
            .cpanel.yml

      - name: Weka kitufe cha uhakiki cha deploy
        run: |
          echo "sha=${{ github.sha }}" > .deploy-check.txt
          echo "workflow=Deploy to Namecheap" >> .deploy-check.txt
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> .deploy-check.txt
          echo "server-dir=${{ vars.FTP_SERVER_DIR || secrets.FTP_SERVER_DIR || './public_html/' }}" >> .deploy-check.txt

      - name: Paka kitufe cha uhakiki
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER || secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: ${{ vars.FTP_SERVER_DIR || secrets.FTP_SERVER_DIR || './public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            config.example.php
            .cpanel.yml
            vendor/**
          additional-files: |
            .deploy-check.txt
