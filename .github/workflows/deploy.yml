name: Deploy to Namecheap

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pakua code
        uses: actions/checkout@v4

      - name: Angalia FTP credentials
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USER || secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASS || secrets.FTP_PASSWORD }}
        run: |
          missing=0
          if [ -z "$FTP_SERVER" ]; then echo "::error::Missing secret FTP_SERVER"; missing=1; fi
          if [ -z "$FTP_USER" ]; then echo "::error::Missing secret FTP_USER (or FTP_USERNAME)"; missing=1; fi
          if [ -z "$FTP_PASS" ]; then echo "::error::Missing secret FTP_PASS (or FTP_PASSWORD)"; missing=1; fi
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "FTP credentials are present."

      - name: Andaa deploy-check.txt
        run: |
          printf 'sha=%s\n' "${GITHUB_SHA}" > deploy-check.txt
          printf 'time=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> deploy-check.txt
          printf 'server-dir=%s\n' "${{ vars.FTP_SERVER_DIR || secrets.FTP_SERVER_DIR || './public_html/' }}" >> deploy-check.txt

      - name: Pakia kwa FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER || secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASS || secrets.FTP_PASSWORD }}
          server-dir: ${{ vars.FTP_SERVER_DIR || secrets.FTP_SERVER_DIR || './public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            config.local.php
            .env
            database/**
            README.md
          additional-files: |
            deploy-check.txt
